<!doctype html>
<html lang="pt-BR" translate="no">
  <!-- translate="no" + meta google: impede o tradutor automático do navegador de "traduzir" a
       página (o app já tem i18n próprio) e corromper textos como "Concluído" e nomes de cursos. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Treinamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes do React carregar, para não piscar. Sem escolha salva = escuro.
      (function () {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'system') theme = 'dark';
        if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
